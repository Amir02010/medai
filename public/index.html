<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#f4f8ff" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/logo192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>MedAI — умный помощник по здоровью</title>
    <meta
      name="description"
      content="MedAI разбирает симптомы, находит ближайшие аптеки, подсказывает нужного врача и напоминает о приёме лекарств. На узбекском, русском и английском."
    />
    <meta name="keywords" content="MedAI, tibbiyot, dorixona, shifokor, симптомы, аптеки, врач, Узбекистан, Самарканд" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MedAI" />
    <meta property="og:title" content="MedAI — умный помощник по здоровью" />
    <meta
      property="og:description"
      content="Разбор симптомов за секунды, аптеки рядом, запись к врачу и напоминания о лекарствах. UZ · RU · EN."
    />
    <meta property="og:image" content="%PUBLIC_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://medai-beige.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />

    <!-- Telegram Mini App SDK: подключается только внутри Telegram, в вебе безвреден -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
      // Тема применяется до первой отрисовки, чтобы не было белой вспышки
      (function () {
        try {
          var raw = localStorage.getItem("medai-store-v1");
          var mode = raw ? (JSON.parse(raw).state || {}).theme : "auto";
          var dark =
            mode === "dark" ||
            ((!mode || mode === "auto") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          if (dark) {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#080d18");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Для работы MedAI нужен включённый JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
